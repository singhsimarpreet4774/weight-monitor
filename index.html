<!DOCTYPE html>
<html>

<head>
  <title>Live Weight Monitor</title>

  <style>

    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      margin-top: 100px;
    }

    h1 {
      font-size: 50px;
    }

    #weight {
      font-size: 120px;
      margin-top: 40px;
      color: #00ff99;
    }

    #status {
      margin-top: 20px;
      font-size: 20px;
      color: #888;
    }

  </style>
</head>

<body>

  <h1>Live Weight</h1>

  <div id="weight">-- g</div>

  <div id="status">Connecting...</div>

  <script>

    const CHANNEL_ID = "YOUR_CHANNEL_ID";

    async function fetchWeight() {

      try {

        const response = await fetch(
          `https://api.thingspeak.com/channels/${CHANNEL_ID}/fields/1/last.json`
        );

        const data = await response.json();

        const weight = parseFloat(data.field1);

        document.getElementById("weight").innerHTML =
          weight.toFixed(1) + " g";

        document.getElementById("status").innerHTML =
          "Updated: " + new Date().toLocaleTimeString();

      } catch (error) {

        document.getElementById("status").innerHTML =
          "Connection Error";

      }
    }

    // Fetch immediately
    fetchWeight();

    // Update every 5 seconds
    setInterval(fetchWeight, 5000);

  </script>

</body>

</html>
