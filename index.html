<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Live Weight Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 42px;
    }

    .weight-box {
      margin-top: 30px;
      font-size: 90px;
      color: #00ff99;
      font-weight: bold;
    }

    .status {
      margin-top: 10px;
      color: #aaa;
      font-size: 18px;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
    }

    canvas {
      background: white;
      border-radius: 20px;
      padding: 20px;
    }

    .history {
      margin-top: 40px;
      background: #1b1f2b;
      padding: 20px;
      border-radius: 20px;
      text-align: left;
    }

    .history h2 {
      text-align: center;
    }

    .history-item {
      padding: 10px;
      border-bottom: 1px solid #333;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>Live Weight Dashboard</h1>

  <div class="weight-box" id="weight">
    -- g
  </div>

  <div class="status" id="status">
    Connecting...
  </div>

  <div class="container">
    <canvas id="weightChart"></canvas>
  </div>

  <div class="container history">
    <h2>Weight History</h2>
    <div id="historyList"></div>
  </div>

  <script>

    // =========================================
    // CHANGE THIS
    // =========================================

    const CHANNEL_ID = '3362467';

    // =========================================

    const chartLabels = [];
    const chartData = [];

    const ctx = document.getElementById('weightChart').getContext('2d');

    const weightChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartLabels,
        datasets: [{
          label: 'Weight (g)',
          data: chartData,
          borderWidth: 3,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });


    async function fetchLatestWeight() {

      try {

        const response = await fetch(
          `https://api.thingspeak.com/channels/${CHANNEL_ID}/fields/1/last.json`
        );

        const data = await response.json();

        const weight = parseFloat(data.field1);

        document.getElementById('weight').innerHTML =
          weight.toFixed(1) + ' g';

        document.getElementById('status').innerHTML =
          'Updated: ' + new Date().toLocaleTimeString();

      } catch (error) {

        document.getElementById('status').innerHTML =
          'Connection Error';
      }
    }


    async function fetchHistory() {

      try {

        const response = await fetch(
          `https://api.thingspeak.com/channels/${CHANNEL_ID}/fields/1.json?results=20`
        );

        const data = await response.json();

        chartLabels.length = 0;
        chartData.length = 0;

        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';

        data.feeds.forEach(feed => {

          if (feed.field1 !== null) {

            const weight = parseFloat(feed.field1);

            const time = new Date(feed.created_at)
              .toLocaleTimeString();

            chartLabels.push(time);
            chartData.push(weight);

            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `${time} → ${weight.toFixed(1)} g`;

            historyList.prepend(div);
          }
        });

        weightChart.update();

      } catch (error) {
        console.log(error);
      }
    }


    // Initial load
    fetchLatestWeight();
    fetchHistory();

    // Refresh every 5 seconds
    setInterval(fetchLatestWeight, 5000);
    setInterval(fetchHistory, 5000);

  </script>

</body>

</html>
